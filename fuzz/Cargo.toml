[package]
name = "ved-quality-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ved-core = { path = "../crates/ved-core", version = "0.1.16" }
serde_yaml = "0.9"

[workspace]
members = ["."]

[[bin]]
name = "parsers"
path = "fuzz_targets/parsers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "paths"
path = "fuzz_targets/paths.rs"
test = false
doc = false
bench = false

[[bin]]
name = "manifest_roundtrip"
path = "fuzz_targets/manifest_roundtrip.rs"
test = false
doc = false
bench = false
