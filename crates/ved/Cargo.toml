[package]
name = "ved"
version = "0.1.22"
edition = "2021"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors = ["Ved Team"]
description = "High-performance deployment compiler for Ved specifications"

[dependencies]
ved-core = { path = "../ved-core", version = "0.1.16", features = ["host"] }
ved-process = { path = "../ved-process", version = "0.1.0" }
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
regex = "1.10"
indexmap = { version = "2.2", features = ["serde"] }
starlark = "0.14.2"
thiserror = "2.0.21"
blake3 = "1.8"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4"
rustix = { version = "1.1.5", features = ["fs", "process"] }

[[bin]]
name = "ved"
path = "src/main.rs"

[lints]
workspace = true
