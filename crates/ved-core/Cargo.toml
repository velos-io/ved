[package]
name = "ved-core"
version = "0.1.16"
edition = "2021"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors = ["Ved Team"]
description = "Core deployment compiler and specification models for Ved"

[features]
default = ["host"]
host = ["dep:starlark", "dep:ved-process", "dep:rustix"]

[dependencies]
ved-process = { path = "../ved-process", version = "0.1.0", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0.21"
regex = "1.10"
indexmap = { version = "2.2", features = ["serde"] }
starlark = { version = "0.14.2", optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["fs"], optional = true }

[dev-dependencies]
proptest = "1.9"
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "quality"
harness = false
required-features = ["host"]

[lints]
workspace = true
