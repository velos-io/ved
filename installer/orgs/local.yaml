# installer/orgs/local.yaml — default org for local dev
# Uses only public registries. Works on any machine without private registry access.
# This file is used when no --org flag is passed (ORG=local is the Makefile default).

registries:
  ubi:      registry.access.redhat.com
  internal: ""
  external: ""
  npm:      ""
  pip:      ""

images:
  special_lib_version: ""

kubernetes:
  ingress_suffix: app.localapp   # -> app1.app.localapp, api1.app.localapp etc.
  image_registry: ""             # empty -> no overlays/dev image substitution
  image_prefix:   ""
  pull_secret:    ""
