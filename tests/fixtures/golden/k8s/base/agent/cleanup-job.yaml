apiVersion: v1
kind: ConfigMap
metadata:
  name: cleanup-job-env
data:
  DB_HOST: postgres.infra.svc.cluster.local
  RETENTION_DAYS: '30'
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cleanup-job
spec:
  schedule: 0 2 * * *
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: cleanup-job
        spec:
          containers:
          - name: cleanup-job
            image: postgres:16
            envFrom:
            - configMapRef:
                name: cleanup-job-env
            securityContext:
              readOnlyRootFilesystem: true
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          restartPolicy: OnFailure
