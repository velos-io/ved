apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-env
data:
  PORT: '8080'
  LAMBDA_URL: http://lambda-emulator.agent.svc.cluster.local:8080/2015-03-31/functions/function/invocations
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app.kubernetes.io/name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: node:20-alpine
        ports:
        - containerPort: 8080
          name: port-8080
        envFrom:
        - configMapRef:
            name: api-gateway-env
        securityContext:
          readOnlyRootFilesystem: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
  - name: port-8080
    port: 8080
    targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway
spec:
  ingressClassName: nginx
  rules:
  - host: app.app.localapp
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 8080
