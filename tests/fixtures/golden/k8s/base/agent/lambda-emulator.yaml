apiVersion: v1
kind: ConfigMap
metadata:
  name: lambda-emulator-env
data:
  DB_HOST: postgres.infra.svc.cluster.local
  DB_PORT: '5432'
  DB_NAME: demo
  DB_USER: demo_app
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.tools.svc.cluster.local:4317
  OTEL_RESOURCE_ATTRIBUTES: service.name=lambda-emulator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lambda-emulator
  labels:
    app.kubernetes.io/name: lambda-emulator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lambda-emulator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lambda-emulator
    spec:
      containers:
      - name: lambda-emulator
        image: public.ecr.aws/lambda/nodejs:24
        ports:
        - containerPort: 8080
          name: port-8080
        envFrom:
        - configMapRef:
            name: lambda-emulator-env
        - secretRef:
            name: app-secrets
        resources:
          limits:
            memory: 512Mi
          requests:
            memory: 512Mi
        volumeMounts:
        - name: app-config
          mountPath: /etc/app
          readOnly: true
        - name: vol-app-json
          mountPath: /etc/app/config.json
          readOnly: true
        securityContext:
          readOnlyRootFilesystem: false
      volumes:
      - name: app-config
        configMap:
          name: lambda-emulator-config
      - name: vol-app-json
        hostPath:
          path: ./config/app.json
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
      - name: wait-for-db
        image: myacr.azurecr.io/external/busybox:1.36
        command:
        - sh
        - -c
        - until nc -z $DB_HOST 5432; do sleep 2; done
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: lambda-emulator
spec:
  selector:
    app.kubernetes.io/name: lambda-emulator
  ports:
  - name: port-8080
    port: 8085
    targetPort: 8080
