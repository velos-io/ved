apiVersion: v1
kind: ConfigMap
metadata:
  name: smoke-test-env
data:
  TARGET_URL: http://api-gateway:8080/smoke
---
apiVersion: batch/v1
kind: Job
metadata:
  name: smoke-test
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smoke-test
    spec:
      containers:
      - name: smoke-test
        image: curlimages/curl:8.6.0
        command:
        - curl
        - -f
        - http://api-gateway:8080/smoke
        envFrom:
        - configMapRef:
            name: smoke-test-env
        securityContext:
          readOnlyRootFilesystem: true
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      restartPolicy: Never
