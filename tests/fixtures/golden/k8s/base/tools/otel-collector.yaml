apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
    spec:
      containers:
      - name: otel-collector
        image: otel/opentelemetry-collector:0.114.0
        command:
        - --config=/etc/otel/config.yaml
        ports:
        - containerPort: 4317
          name: port-4317
        - containerPort: 4318
          name: port-4318
        volumeMounts:
        - name: vol-otel-yaml
          mountPath: /etc/otel/config.yaml
          readOnly: false
        securityContext:
          readOnlyRootFilesystem: false
      volumes:
      - name: vol-otel-yaml
        hostPath:
          path: ./config/otel.yaml
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
spec:
  selector:
    app.kubernetes.io/name: otel-collector
  ports:
  - name: port-4317
    port: 4317
    targetPort: 4317
  - name: port-4318
    port: 4318
    targetPort: 4318
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: otel-collector
spec:
  ingressClassName: nginx
  rules:
  - host: otel.app.localapp
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: otel-collector
            port:
              number: 4317
