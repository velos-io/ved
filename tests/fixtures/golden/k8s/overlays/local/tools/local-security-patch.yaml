apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
spec:
  template:
    spec:
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
      containers:
      - name: otel-collector
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
