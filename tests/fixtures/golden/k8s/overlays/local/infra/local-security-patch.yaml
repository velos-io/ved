apiVersion: batch/v1
kind: Job
metadata:
  name: flyway-demo
spec:
  template:
    spec:
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
      containers:
      - name: flyway-demo
        securityContext:
          allowPrivilegeEscalation: true
          readOnlyRootFilesystem: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  template:
    spec:
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
      containers:
      - name: postgres
        securityContext:
          allowPrivilegeEscalation: true
          readOnlyRootFilesystem: false
